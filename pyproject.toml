[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-signals"
version = "0.1.0"
description = "Production-grade ML pipeline for crypto trading signals (read-only market data)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.scripts]
ml-signals = "src.main:main"

[tool.setuptools]
packages = [
    "src",
    "src.data",
    "src.features",
    "src.regime",
    "src.labeling",
    "src.validation",
    "src.models",
    "src.conformal",
    "src.drift",
    "src.selection",
    "src.quality",
    "src.ranking",
    "src.backtest",
    "src.pipeline",
    "src.scanner",
    "src.reporting",
    "src.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Keep test output focused on real failures, not third-party noise.
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::UserWarning:sklearn",
    "ignore::FutureWarning:sklearn",
]
